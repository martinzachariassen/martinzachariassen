<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240" role="img" aria-label="mlz.">
<style>
@font-face { font-family: "Plex"; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }
svg { shape-rendering: geometricPrecision; text-rendering: geometricPrecision; }
text { font-family: "Plex", ui-monospace, Menlo, monospace; font-weight: 700; font-size: 95px; fill: #e9ebef; }
.period { fill: #a29aff; }
.trace { opacity: 0; fill: none; stroke: #000; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 100; }
.cursor { opacity: 0; fill: #a29aff; transform-box: fill-box; transform-origin: 0 0; }

.mark { transform-box: fill-box; transform-origin: center; animation: mark 6.5s infinite; }
.cut { animation: cut 6.5s infinite; }
.trace { animation: trace 6.5s infinite; }
.period { animation: period 6.5s infinite; }
.cursor { animation: cursor-move 6.5s infinite, cursor-blink 6.5s infinite; }

@keyframes mark {
  0.000% { opacity: 0; transform: translateY(2.86px) scale(0.96); animation-timing-function: step-end; }
  1.538% { opacity: 0; transform: translateY(2.86px) scale(0.96); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  15.385% { opacity: 1; transform: translateY(0) scale(1); animation-timing-function: step-end; }
  82.308% { opacity: 1; transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0); }
  89.231% { opacity: 0; transform: translateY(-2.86px) scale(0.96); animation-timing-function: step-end; }
  100.000% { opacity: 0; transform: translateY(-2.86px) scale(0.96); animation-timing-function: step-end; }
}
@keyframes cut {
  0.000% { opacity: 0; animation-timing-function: step-end; }
  14.615% { opacity: 0; animation-timing-function: ease-out; }
  20.769% { opacity: 1; animation-timing-function: step-end; }
  80.000% { opacity: 1; animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  83.846% { opacity: 0; animation-timing-function: step-end; }
  100.000% { opacity: 0; animation-timing-function: step-end; }
}
@keyframes trace {
  0.000% { opacity: 0; stroke-dashoffset: 100; animation-timing-function: step-end; }
  6.923% { opacity: 1; stroke-dashoffset: 100; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
  19.231% { opacity: 1; stroke-dashoffset: 0; animation-timing-function: ease-out; }
  23.077% { opacity: 0; stroke-dashoffset: 0; animation-timing-function: step-end; }
  100.000% { opacity: 0; stroke-dashoffset: 0; animation-timing-function: step-end; }
}
@keyframes period {
  0.000% { opacity: 0; animation-timing-function: step-end; }
  41.077% { opacity: 0; animation-timing-function: linear; }
  43.846% { opacity: 1; animation-timing-function: step-end; }
  61.538% { opacity: 1; animation-timing-function: linear; }
  64.308% { opacity: 0; animation-timing-function: step-end; }
  100.000% { opacity: 0; animation-timing-function: step-end; }
}
@keyframes cursor-move {
  0.000% { transform: translate(0.00px, 0) scale(1, 1); animation-timing-function: step-end; }
  26.154% { transform: translate(0.00px, 0) scale(1, 1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  27.231% { transform: translate(54.15px, 0) scale(1, 1); animation-timing-function: step-end; }
  28.308% { transform: translate(54.15px, 0) scale(1, 1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  29.385% { transform: translate(108.30px, 0) scale(1, 1); animation-timing-function: step-end; }
  31.231% { transform: translate(108.30px, 0) scale(1, 1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  32.308% { transform: translate(162.45px, 0) scale(1, 1); animation-timing-function: step-end; }
  36.923% { transform: translate(162.45px, 0) scale(1, 1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  43.846% { transform: translate(176.22px, 52.34px) scale(0.4200, 0.2716); animation-timing-function: step-end; }
  64.308% { transform: translate(176.22px, 52.34px) scale(0.4200, 0.2716); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  70.462% { transform: translate(162.45px, 0) scale(1, 1); animation-timing-function: step-end; }
  73.077% { transform: translate(162.45px, 0) scale(1, 1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  74.154% { transform: translate(108.30px, 0) scale(1, 1); animation-timing-function: step-end; }
  74.615% { transform: translate(108.30px, 0) scale(1, 1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  75.692% { transform: translate(54.15px, 0) scale(1, 1); animation-timing-function: step-end; }
  76.154% { transform: translate(54.15px, 0) scale(1, 1); animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  77.231% { transform: translate(0.00px, 0) scale(1, 1); animation-timing-function: step-end; }
  100.000% { transform: translate(0.00px, 0) scale(1, 1); animation-timing-function: step-end; }
}
@keyframes cursor-blink {
  0.000% { opacity: 0; animation-timing-function: step-end; }
  13.846% { opacity: 0; animation-timing-function: ease-in-out; }
  15.692% { opacity: 1; animation-timing-function: step-end; }
  19.231% { opacity: 1; animation-timing-function: ease-in-out; }
  21.077% { opacity: 0; animation-timing-function: step-end; }
  23.077% { opacity: 0; animation-timing-function: ease-in-out; }
  24.923% { opacity: 1; animation-timing-function: step-end; }
  41.077% { opacity: 1; animation-timing-function: linear; }
  43.846% { opacity: 0; animation-timing-function: step-end; }
  61.538% { opacity: 0; animation-timing-function: linear; }
  64.308% { opacity: 1; animation-timing-function: step-end; }
  78.462% { opacity: 1; animation-timing-function: ease-in-out; }
  80.308% { opacity: 0; animation-timing-function: step-end; }
  100.000% { opacity: 0; animation-timing-function: step-end; }
}
@keyframes ch0 {
  0.000% { opacity: 0; animation-timing-function: step-end; }
  26.154% { opacity: 1; animation-timing-function: step-end; }
  76.154% { opacity: 0; animation-timing-function: step-end; }
  100.000% { opacity: 0; animation-timing-function: step-end; }
}
.ch0 { animation: ch0 6.5s infinite; }
@keyframes ch1 {
  0.000% { opacity: 0; animation-timing-function: step-end; }
  28.308% { opacity: 1; animation-timing-function: step-end; }
  74.615% { opacity: 0; animation-timing-function: step-end; }
  100.000% { opacity: 0; animation-timing-function: step-end; }
}
.ch1 { animation: ch1 6.5s infinite; }
@keyframes ch2 {
  0.000% { opacity: 0; animation-timing-function: step-end; }
  31.231% { opacity: 1; animation-timing-function: step-end; }
  73.077% { opacity: 0; animation-timing-function: step-end; }
  100.000% { opacity: 0; animation-timing-function: step-end; }
}
.ch2 { animation: ch2 6.5s infinite; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
<defs>
  <!-- White keeps the square, black cuts it: the M and its tracing line. -->
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect x="1" y="1" width="30" height="30" rx="6" fill="#fff"/>
    <polygon class="cut" points="7,25 7,7 11.5,7 16,18.5 20.5,7 25,7 25,25" fill="#000"/>
    <polygon class="trace" points="7,25 7,7 11.5,7 16,18.5 20.5,7 25,7 25,25" pathLength="100"/>
  </mask>
</defs>

<g transform="translate(453 64) scale(3.5)">
  <g class="mark">
    <rect x="1" y="1" width="30" height="30" rx="6" fill="#e9ebef" mask="url(#m)"/>
  </g>
</g>

<g class="word"><text class="ch0" x="610.00" y="155">m</text><text class="ch1" x="664.15" y="155">l</text><text class="ch2" x="718.30" y="155">z</text><text class="period" x="772.45" y="155">.</text></g>
<rect class="cursor" x="614.75" y="84.70" width="47.50" height="70.30"/>
</svg>
